[package]
name = "schnittwerk"
description = "Linux-Software für Silhouette-Schneideplotter"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "schnittwerk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
schnittwerk-core = { path = "../crates/schnittwerk-core" }
schnittwerk-plotter = { path = "../crates/schnittwerk-plotter" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
base64 = "0.22"
kurbo = "0.11"
flate2 = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
notify-rust = "4"
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }
