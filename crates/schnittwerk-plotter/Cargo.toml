[package]
name = "schnittwerk-plotter"
description = "USB- und Bluetooth-Anbindung für Silhouette-Schneideplotter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
schnittwerk-core = { path = "../schnittwerk-core" }
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures = "0.3"
uuid = "1"
