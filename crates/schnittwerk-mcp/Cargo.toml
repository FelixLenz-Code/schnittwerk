[package]
name = "schnittwerk-mcp"
description = "MCP-Server für Schnittwerk: Tracen, Sticker-Bögen und Schneiden für KI-Assistenten"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
schnittwerk-core = { path = "../schnittwerk-core" }
schnittwerk-plotter = { path = "../schnittwerk-plotter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
base64 = "0.22"
kurbo = "0.11"
