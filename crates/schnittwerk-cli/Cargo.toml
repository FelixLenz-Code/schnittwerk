[package]
name = "schnittwerk-cli"
description = "Schnittwerk auf der Kommandozeile: Bilder tracen und Dateien schneiden"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
schnittwerk-core = { path = "../schnittwerk-core" }
schnittwerk-plotter = { path = "../schnittwerk-plotter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
kurbo = "0.11"
