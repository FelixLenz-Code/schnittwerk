# Baut .deb und Flatpak und legt ein GitHub-Release an, sobald ein Tag v*
# gepusht wird.
#   git tag v0.8.1 && git push origin v0.8.1
# Ohne Tag (manuell über "Run workflow") wird nur gebaut und die Pakete
# werden als Artefakte hochgeladen.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version prüfen
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $version in Cargo.toml"
            exit 1
          fi

      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libdbus-1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: |
          cargo test -p schnittwerk-core --release
          python3 scripts/i18n-keys.py

      - name: .deb bauen
        run: npm run tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: schnittwerk-deb
          path: target/release/bundle/deb/*.deb

  # Das Flatpak verpackt die Programme aus dem .deb (gebaut auf Ubuntu 24.04,
  # läuft mit der GNOME-Runtime).
  flatpak:
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: schnittwerk-deb
          path: deb

      - name: flatpak-builder und GNOME-Runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Flatpak bauen
        run: |
          cp deb/*.deb packaging/flatpak/schnittwerk.deb
          cd packaging/flatpak
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo=repo --force-clean build de.schnittwerk.Schnittwerk.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo ../../Schnittwerk.flatpak de.schnittwerk.Schnittwerk

      - uses: actions/upload-artifact@v7
        with:
          name: schnittwerk-flatpak
          path: Schnittwerk.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [deb, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # Änderungen = Text der Commit-Nachricht des Tags (ohne Signaturzeilen).
          # Das Update-Fenster der App zeigt genau diesen Abschnitt.
          changes=$(git log -1 --format=%b "$GITHUB_SHA" | grep -v -i -E '^(co-authored-by|claude-session):' | sed -e '/./,$!d')
          cd dist
          # Feste Namen für die Ein-Befehl-Installation (…/releases/latest/download/…).
          cp "Schnittwerk_${v}_amd64.deb" Schnittwerk_amd64.deb
          cp Schnittwerk.flatpak "Schnittwerk_${v}_x86_64.flatpak"
          repo="https://github.com/${GITHUB_REPOSITORY}"
          {
            echo "## Änderungen"
            echo
            echo "${changes:-Siehe Commits.}"
            echo
          } > notes.md
          cat >> notes.md <<EOF
          **Installation mit einem Befehl** (Ubuntu 24.04 oder neuer):
          \`\`\`
          wget -O /tmp/schnittwerk.deb ${repo}/releases/latest/download/Schnittwerk_amd64.deb && sudo apt install -y /tmp/schnittwerk.deb
          \`\`\`
          Danach den Plotter einmal aus- und wieder einstecken (udev-Regel).

          **Flatpak mit einem Befehl** (andere Distributionen):
          \`\`\`
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo && curl -fL -o /tmp/Schnittwerk.flatpak ${repo}/releases/latest/download/Schnittwerk.flatpak && flatpak install --user -y /tmp/Schnittwerk.flatpak
          \`\`\`
          Für USB einmalig die udev-Regel installieren, siehe [README](${repo}#flatpak).

          Ausführliche Anleitung: [README](${repo}#installation)

          > [!NOTE]
          > **Von einer KI geschrieben.** Der Code wurde mit Claude (Anthropic) erstellt,
          > unter Anleitung und mit Tests durch einen Menschen, aber nicht unabhängig geprüft.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "Schnittwerk_${v}_amd64.deb" Schnittwerk_amd64.deb \
            "Schnittwerk_${v}_x86_64.flatpak" Schnittwerk.flatpak \
            --title "Schnittwerk $v" --notes-file notes.md --generate-notes
