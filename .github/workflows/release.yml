# Baut das .deb und legt ein GitHub-Release an, sobald ein Tag v* gepusht wird.
#   git tag v0.3.1 && git push origin v0.3.1
# Ohne Tag (manuell über "Run workflow") wird nur gebaut und das .deb als
# Artefakt hochgeladen.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version prüfen
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $version in Cargo.toml"
            exit 1
          fi

      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libdbus-1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: cargo test -p schnittwerk-core --release

      - name: .deb bauen
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: schnittwerk-deb
          path: target/release/bundle/deb/*.deb

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          **Installation** (Ubuntu 24.04 oder neuer):
          \`\`\`
          sudo apt install ./Schnittwerk_${v}_amd64.deb
          \`\`\`
          Danach den Plotter einmal aus- und wieder einstecken (udev-Regel).
          Ausführliche Anleitung: [README](https://github.com/${GITHUB_REPOSITORY}#installation)

          > [!NOTE]
          > **Von einer KI geschrieben.** Der Code wurde mit Claude (Anthropic) erstellt,
          > unter Anleitung und mit Tests durch einen Menschen, aber nicht unabhängig geprüft.
          EOF
          gh release create "$GITHUB_REF_NAME" target/release/bundle/deb/*.deb \
            --title "Schnittwerk $v" --notes-file notes.md --generate-notes
